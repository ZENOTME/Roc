[package]
name = "roc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Extensible Arrow execution engine with pipeline scheduling"
license = "Apache-2.0"

[dependencies]
arrow = { version = "59.2.0", default-features = false }
async-channel = "2.5"
asyncband = { version = "0.7.2", default-features = false, features = ["shutdown"] }
datafusion-common = { version = "55.1.0", default-features = false }
datafusion-expr-common = { version = "55.1.0", default-features = false }
datafusion-physical-expr = { version = "55.1.0", default-features = false }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
datafusion-functions-aggregate = { version = "55.1.0", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
