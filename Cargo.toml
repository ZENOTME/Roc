[package]
name = "roc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Extensible Arrow execution engine with pipeline scheduling"
license = "Apache-2.0"

[dependencies]
arrow = { version = "59.2.0", default-features = false }
asyncband = { version = "0.7.3", default-features = false, features = ["shutdown", "mpmc"] }
futures = "0.3"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[[bench]]
name = "add_kernel"
harness = false

[[bench]]
name = "add_nullable"
harness = false
