[package]
name = "roc-datafusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "DataFusion Parquet scans for Roc pipelines"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
roc = { path = "../.." }
arrow = { version = "59.2.0", default-features = false }
asyncband = { version = "0.7.3", default-features = false, features = ["shutdown"] }
datafusion = { version = "=55.1.0", default-features = false, features = ["parquet", "sql"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[dev-dependencies]
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
